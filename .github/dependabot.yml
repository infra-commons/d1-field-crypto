version: 2
updates:
  # TypeScript build/test toolchain (package.json).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Batch minor/patch bumps into one weekly PR; majors open individually.
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # GitHub Actions version pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # Batch minor/patch action bumps into one PR; majors open individually.
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
